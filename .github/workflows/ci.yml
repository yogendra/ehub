name: Spring Boot CI

on:
  push:
    paths:
      - "ehub-sample-project/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "ehub-sample-project/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Access Tunnel
        env:
          TUNNEL_TRANSPORT_PROTOCOL: http2 # Optional: forces a stable protocol
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cloudflared access tcp --hostname ${{ secrets.CF_ACCESS_HOSTNAME }} --listener localhost:7233 &
          # Give it a few seconds to establish the connection
          sleep 5
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> $GITHUB_PATH
      - name: Run Temporal CLI or SDK
        run: |
          # Your app/CLI now talks to localhost:7233
          # Example using Temporal CLI:
          temporal workflow list --address localhost:7233
      - name: Trigger Temporal CI/CD Workflow
        env:
          TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_NAMESPACE }}
          TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}
          TEMPORAL_WORKFLOW_TYPE: ${{ secrets.TEMPORAL_WORKFLOW_TYPE }}
        run: |
          temporal workflow start \
            --type "$TEMPORAL_WORKFLOW_TYPE" \
            --workflow-id "ehub-sample-project-${{ github.sha }}" \
            --task-queue "ehub-cicd" \
            --address localhost:7233 \
            --namespace "$TEMPORAL_NAMESPACE" \
            --api-key "$TEMPORAL_API_KEY" \
            --input '{"project": "ehub-sample-project", "sha": "${{ github.sha }}"}'
