version: "3"

vars:
  CONDA_ENV: ehub
  PROJECT_DIR: "{{.ROOT_DIR}}"


includes:
  core:
    taskfile: ehub-core/Taskfile.yml
    dir: ehub-core
  cli:
    taskfile: ehub-cli/Taskfile.yml
    dir: ehub-cli
    
tasks:
  setup:
    desc: Set up the project (conda)
    cmds:
      - conda env create -f environment.yml || conda env update -f environment.yml --prune
      - cp -n .env.example .env || true

  lint:
    desc: Run linting tools
    cmds:
      - conda run -n {{.CONDA_ENV}} ruff check .
      - conda run -n {{.CONDA_ENV}} black --check .
      - conda run -n {{.CONDA_ENV}} mypy .

  test:
    desc: Run all tests
    cmds:
      - task: core:test
      - task: cli:test
